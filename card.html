<style>
  :root{--navy:#1B4F72;--navy-dark:#143A55;--lime:#A8CC00;--lime-dark:#8FB300;--cream:#f0ebe3;--soft:#F7EDD8;--white:#fff;--text:#2A2A2A;--muted:#6B6B6B;--line:#E5DFD5;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow-x:hidden;background:var(--cream);}
  body::before{content:'';position:fixed;top:-30%;right:-20%;width:80vw;height:80vw;background:radial-gradient(circle,rgba(168,204,0,0.18),transparent 70%);border-radius:50%;z-index:0;animation:float1 14s ease-in-out infinite;}
  body::after{content:'';position:fixed;bottom:-30%;left:-20%;width:80vw;height:80vw;background:radial-gradient(circle,rgba(27,79,114,0.12),transparent 70%);border-radius:50%;z-index:0;animation:float2 16s ease-in-out infinite;}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}
  .card{position:relative;z-index:1;background:var(--white);border-radius:28px;box-shadow:0 30px 70px rgba(27,79,114,0.15);max-width:420px;width:100%;padding:2.5rem 2rem;text-align:center;animation:rise 0.7s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;border-radius:28px 28px 0 0;background:linear-gradient(90deg,var(--lime),var(--navy));}
  .photo-wrap{display:inline-block;padding:4px;background:linear-gradient(135deg,var(--lime),var(--navy));border-radius:50%;margin-bottom:1.2rem;}
  .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center 22%;display:block;border:3px solid var(--white);}
  .name{font-size:1.7rem;font-weight:800;color:var(--navy);letter-spacing:-0.02em;}
  .title{font-size:0.95rem;color:var(--muted);margin-top:0.2rem;font-weight:500;}
  .brand{display:inline-block;margin-top:0.5rem;font-weight:800;letter-spacing:-0.03em;color:var(--navy);font-size:1.05rem;}
  .brand .ia{color:var(--lime-dark);}
  .tagline{font-size:0.9rem;color:var(--text);margin:1rem auto 1.6rem;max-width:300px;line-height:1.5;font-style:italic;}
  .save-btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;background:var(--navy);color:var(--white);border:none;border-radius:999px;padding:1rem 1.5rem;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;}
  .save-btn:hover{background:var(--lime);color:var(--navy);transform:translateY(-2px);box-shadow:0 10px 24px rgba(168,204,0,0.35);}
  .links{display:flex;justify-content:center;gap:0.6rem;margin-top:1.2rem;}
  .links a{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--cream);color:var(--navy);transition:all .25s;border:1px solid var(--line);}
  .links a:hover{background:var(--lime);color:var(--navy);transform:translateY(-2px);}
  .links svg{width:20px;height:20px;}
  .divider{display:flex;align-items:center;gap:0.8rem;margin:1.8rem 0 1.2rem;color:var(--muted);font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.15em;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .qr{width:150px;height:150px;border-radius:14px;padding:8px;background:var(--cream);}
  .qr-cap{font-size:0.75rem;color:var(--muted);margin-top:0.5rem;}
  .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:0.8rem 1.4rem;border-radius:999px;font-size:0.85rem;font-weight:600;opacity:0;transition:all .35s;z-index:10;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
